# mpd-notifier configuration
#
# Copied to ~/.config/mpd-notifier/mpd-notifier.conf on first run if that
# file doesn't already exist. Edit the copy there, not this template.

# Local music library path, used to look up cover.jpg next to the playing
# track. Only used when MPD_HOST is empty (see below).
dir="$HOME/Music/"

# MPD host address. Leave empty ("") to treat MPD as running locally and
# read cover art from $dir; set to a hostname/IP to query a remote MPD
# instead (cover art lookup is skipped in that case).
MPD_HOST=""

# How long the notification stays on screen, in milliseconds.
notify_duration="5000"

# Where the fallback image and copied cover art are cached.
cache_dir="$HOME/.cache/mpd-notifier/"

# Add Previous/Play-Pause/Next buttons to the notification (requires a
# notify-send that supports -A/--action, e.g. libnotify-bin; not all
# providers do). Set to "true" to enable. Default: "false".
enable_actions="false"
